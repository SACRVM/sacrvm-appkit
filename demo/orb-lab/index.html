<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Lab | SACRVM DEMO</title>
    <link rel="stylesheet" href="style.css">

    <script defer src="../../kit/js/lib/globals.js"></script>
    <script defer src="../../kit/js/lib/icons.js"></script>
    <script defer src="../../kit/js/lib/router.js"></script>
    <script defer src="../../kit/js/lib/pan-zoom.js"></script>
    <script defer src="../../kit/js/lib/hotkeys.js"></script>
    <script defer src="../../kit/js/lib/color.js"></script>
    <script defer src="../../kit/js/vendor/marked.min.js"></script>
    <script defer src="../../kit/js/vendor/purify.min.js"></script>

    <script defer src="../../kit/js/components/sac-icon.js"></script>
    <script defer src="../../kit/js/components/sac-nav.js"></script>
    <script defer src="../../kit/js/components/sac-window.js"></script>
    <script defer src="../../kit/js/components/sac-split.js"></script>
    <script defer src="../../kit/js/components/sac-section.js"></script>
    <script defer src="../../kit/js/components/sac-toggle.js"></script>
    <script defer src="../../kit/js/components/sac-slider.js"></script>
    <script defer src="../../kit/js/components/sac-segmented-control.js"></script>
    <!-- the picker must load before the field, which embeds it -->
    <script defer src="../../kit/js/components/sac-color-picker.js"></script>
    <script defer src="../../kit/js/components/sac-color-field.js"></script>
    <script defer src="../../kit/js/components/sac-log.js"></script>
    <script defer src="../../kit/js/components/sac-hud.js"></script>
    <script defer src="../../kit/js/components/sac-toast.js"></script>
    <script defer src="../../kit/js/components/sac-command-palette.js"></script>
</head>
<body class="app-page">
    <sac-nav brand="SACRVM DEMO" app-name="ORB LAB" brand-icon="cube" brand-href="../">
        <div slot="toolbar" class="toolbar">
            <button class="btn primary" id="btn-pause">Pause</button>
            <button class="btn" id="btn-reset">Reset View</button>
            <button class="nav-icon-btn" id="btn-help" title="Help">
                <sac-icon name="info" style="--icon-size:20px"></sac-icon>
            </button>
        </div>
    </sac-nav>

    <div class="workspace">
        <div class="main-layout">

            <!-- Resizable sidebar: one <sac-split> owns both widths. min-start
                 keeps the controls usable, min-end protects the canvas. Drag
                 the hairline, or focus it and use the arrow keys. -->
            <sac-split id="layout-split" style="flex:1"
                       position="22%" min-start="200px" min-end="320px"
                       aria-label="Resize the sidebar">

                <div class="sidebar" slot="start" style="width:100%;height:100%">
                    <sac-section title="Simulation">
                        <sac-slider id="ctl-count" label="Orbs" min="10" max="300" step="10" value="80"></sac-slider>
                        <sac-slider id="ctl-speed" label="Speed" min="0" max="3" step="0.1" value="1" suffix="×"></sac-slider>
                        <sac-slider id="ctl-size" label="Size" min="2" max="20" step="1" value="8" suffix="px"></sac-slider>
                    </sac-section>

                    <sac-section title="Look">
                        <sac-toggle id="ctl-trails" label="Trails" checked></sac-toggle>
                        <sac-toggle id="ctl-links" label="Connect lines"></sac-toggle>
                        <div>
                            <label>Color mode</label>
                            <!-- flex-wrap: four options no longer fit one row
                                 at the sidebar's minimum width. -->
                            <sac-segmented-control id="ctl-colors" value="accent" style="flex-wrap:wrap">
                                <button data-value="accent">Accent</button>
                                <button data-value="palette">Palette</button>
                                <button data-value="mono">Mono</button>
                                <button data-value="custom">Custom</button>
                            </sac-segmented-control>
                        </div>
                        <!-- Only relevant in "custom" mode — script.js flips its
                             [disabled] with the mode, so the row dims itself. -->
                        <sac-color-field id="ctl-custom-color" label="Custom color"
                                         value="#f472b6" disabled></sac-color-field>
                    </sac-section>

                    <sac-section title="Log">
                        <sac-log id="log" style="height: 160px;"></sac-log>
                    </sac-section>
                </div>

                <div class="viewport" id="viewport" slot="end" style="height:100%">
                    <div class="pz-layer" id="layer">
                        <canvas id="canvas"></canvas>
                    </div>
                    <sac-hud position="top-right" id="hud"></sac-hud>
                </div>

            </sac-split>

        </div>
    </div>

    <!-- A help window needs no min/max — close-only chrome. -->
    <sac-window id="help-window" title="Orb Lab Help" width="480px" height="560px"
                left="calc(100vw - 520px)" top="80px" controls="close">
        <div id="help-content"></div>
    </sac-window>

    <!-- Ctrl-K. script.js registers "Reset view" on sac.commands. -->
    <sac-command-palette></sac-command-palette>

    <script defer src="script.js"></script>
    <script type="module">
        import { loadHelp } from "../../kit/js/lib/help-loader.js";
        window.addEventListener("DOMContentLoaded", () => {
            let helpLoaded = false;
            document.getElementById("btn-help").addEventListener("click", () => {
                if (!helpLoaded) { loadHelp("help.md", "help-content"); helpLoaded = true; }
                document.getElementById("help-window").open();
            });
        });
    </script>
</body>
</html>

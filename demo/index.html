<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACRVM DEMO | Hub</title>
    <link rel="stylesheet" href="../kit/css/ui.css">

    <script defer src="../kit/js/lib/globals.js"></script>
    <script defer src="../kit/js/lib/icons.js"></script>
    <script defer src="../kit/js/lib/router.js"></script>
    <script defer src="../kit/js/lib/apps.js"></script>
    <script defer src="../kit/js/components/sac-icon.js"></script>
    <script defer src="../kit/js/components/sac-nav.js"></script>
    <script defer src="../kit/js/components/sac-footer.js"></script>
    <script defer src="../kit/js/components/sac-window.js"></script>
    <!-- the launcher grid + its add-app dialog -->
    <script defer src="../kit/js/components/sac-dialog.js"></script>
    <script defer src="../kit/js/components/sac-launcher.js"></script>
    <!-- used inside the About overlay -->
    <script defer src="../kit/js/components/sac-chip.js"></script>
    <script defer src="../kit/js/components/sac-slider.js"></script>
</head>
<body>
    <sac-nav brand="SACRVM DEMO" app-name="HUB" brand-icon="cube" brand-href="./"></sac-nav>
    <div class="orb"></div>

    <div class="hub-container">
        <header>
            <h1>SACRVM DEMO</h1>
            <p class="intro-text">
                One small but real app proving the kit end-to-end:
                launcher → workspace tool → floating windows.
            </p>
        </header>

        <!-- The hub grid is composed from the app registry (script below):
             one tile per sac.apps.register() manifest. storage="demo-hub"
             persists user edits — tile order, hidden apps, user-added apps —
             under localStorage "sac.launcher.demo-hub" and enables edit mode. -->
        <main>
            <sac-launcher storage="demo-hub"></sac-launcher>
        </main>
    </div>

    <sac-footer brand="SACRVM APPKIT DEMO" version="1.0.0"></sac-footer>

    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            // Nav panel entries (multi-page registry). These need ABSOLUTE
            // paths — sac-nav marks the active one by comparing
            // location.pathname — but the site may sit under a prefix (a
            // GitHub Pages project site does), so derive the base.
            const base = location.pathname.replace(/\/demo\/.*$/, "");
            sac.router.register(base + "/",             null, { label: "Appkit",      icon: "cube" });
            sac.router.register(base + "/demo/",        null, { label: "Hub",         icon: "home" });
            sac.router.register(base + "/demo/orb-lab/", null, { label: "Orb Lab",    icon: "globe" });
            sac.router.register(base + "/styleguide/",  null, { label: "Style Guide", icon: "palette" });

            // App manifests — the <sac-launcher> above renders one tile each.
            // kind:"page" tiles are plain links; kind:"window" tiles open the
            // app in a floating <sac-window>.
            sac.apps.register({
                id:          "orb-lab",
                name:        "Orb Lab",
                icon:        "globe",
                description: "A workspace-layout tool page: sidebar with sliders and " +
                             "toggles, pan/zoom viewport, log, HUD, per-app accent " +
                             "override and a floating help window.",
                kind:        "page",
                href:        "orb-lab/",
            });
            sac.apps.register({
                id:          "about",
                name:        "About This Kit",
                icon:        "info",
                description: "An overlay app: lazily loaded custom element mounted " +
                             "into a floating sac-window via the app contract. " +
                             "Deep link: ?tool=about.",
                kind:        "window",
                tag:         "tool-about",
                src:         "about/about.js",
                width:       "460px",
                height:      "560px",
                badge:       "DEMO",
            });
            sac.apps.register({
                id:          "styleguide",
                name:        "Style Guide",
                icon:        "palette",
                description: "Every token, every component, every pattern — the kit " +
                             "documenting itself.",
                kind:        "page",
                href:        "../styleguide/",
                tile:        "wide",
            });

            sac.apps.init();   // ?app= deep links (+ legacy ?tool= / [data-app] tiles)
        });
    </script>
</body>
</html>

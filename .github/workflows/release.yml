# Fires on every semver tag (v1.0.0, ...). Builds the vendoring ZIP of kit/
# with a VERSION stamp and attaches it to a GitHub release; a second job
# publishes the same plain files to npm when an NPM_TOKEN secret exists and
# skips quietly when it does not. Packaging happens ONLY here, server-side -
# the local dev workflow stays build-free by design.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the vendoring ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > kit/VERSION
          zip -r "sacrvm-appkit-$VERSION.zip" kit LICENSE

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sacrvm-appkit-*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Publish the plain files (skips without NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret configured - skipping the npm courtesy channel."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > kit/VERSION
          npm version --no-git-tag-version "$VERSION"
          npm publish --access public
